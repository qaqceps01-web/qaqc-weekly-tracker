<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA/QC Weekly Sync</title>
<style>
  html,body{margin:0;background:#F4F6F5}
  :root{
    --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#6B7280;
    --line:#D9DDDC; --header:#1F3B4D; --header-dim:#3A5568;
    --done-bg:#E9F6EE; --done-text:#1E7A44;
    --next-bg:#FDF3E3; --next-text:#8A5A05;
    --accent:#1C6E8C;
  }
  *{box-sizing:border-box}
  #qq2{font-family:Calibri,'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--surface);
    border-radius:8px;overflow:hidden;border:1px solid var(--line);font-size:14px;
    max-width:1220px;margin:20px auto}
  #qq2 button{font-family:inherit;cursor:pointer;border-radius:4px;transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease}
  #qq2 button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #qq2 input,#qq2 select{font-family:inherit;color:var(--ink)}
  #qq2 ::selection{background:var(--accent);color:#fff}
  #qq2 td.qq2-no{font-variant-numeric:tabular-nums}

  .qq2-header{background:var(--header);color:#fff;padding:12px 18px}
  .qq2-header-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .qq2-title{font-size:17px;font-weight:700}
  .qq2-week-select{background:#fff;color:var(--header);border:1px solid transparent;
    font-weight:700;font-size:12.5px;padding:5px 9px;border-radius:4px;white-space:nowrap;
    max-width:220px}
  .qq2-week-select:hover{background:#F1F5F6}
  .qq2-week-select:focus-visible{outline:2px solid #fff;outline-offset:1px}
  .qq2-newweek{background:transparent;border:1px dashed #7E97A3;color:#D7E2E8;font-size:12.5px;
    padding:5px 11px;border-radius:4px;white-space:nowrap}
  .qq2-newweek:hover{border-color:#fff;color:#fff}
  .qq2-db-link{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid #7E97A3;color:#D7E2E8;font-size:12.5px;padding:5px 11px;border-radius:4px;white-space:nowrap;text-decoration:none}
  .qq2-db-link:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,0.08)}
  .qq2-db-link svg{flex-shrink:0;opacity:0.9}
  .qq2-newweek-form{display:none;gap:8px;margin-top:9px}
  .qq2-newweek-form.open{display:flex}
  .qq2-newweek-form input{flex:1;max-width:260px;background:#fff;border:1px solid var(--line);
    padding:6px 9px;border-radius:4px;font-size:13px}
  .qq2-newweek-form button{background:var(--accent);border:none;color:#fff;padding:6px 13px;
    border-radius:4px;font-size:12.5px;font-weight:600}
  .qq2-newweek-form .qq2-cancel{background:transparent;color:#D7E2E8;border:1px solid #7E97A3}

  .qq2-toolbar{display:flex;align-items:center;justify-content:space-between;
    padding:9px 18px;border-bottom:1px solid var(--line);background:#FAFBFB;flex-wrap:wrap;gap:8px}
  .qq2-stats{font-size:13px;color:var(--muted)}
  .qq2-stats b{color:var(--ink)}
  .qq2-stats .sd{color:var(--done-text);font-weight:700}
  .qq2-stats .sn{color:var(--next-text);font-weight:700}
  .qq2-stats .sf{color:#C53030;font-weight:700}
  .qq2-sync{font-size:11.5px;color:var(--muted)}
  .qq2-update{background:#FEF3C7;color:#92400E;font-size:13px;font-weight:700;padding:8px 16px;display:flex;align-items:center;gap:12px}
  .qq2-update[hidden]{display:none}
  .qq2-update button{background:#fff;border:1px solid #D9A441;color:#92400E;font-size:12.5px;font-weight:700;padding:4px 11px}
  .qq2-sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8FBF9F;margin-right:5px}
  .qq2-sync.offline .dot{background:#C4CBCE}
  .qq2-extra-toggle{font-size:12.5px;color:var(--accent);background:transparent;border:1px solid var(--line);
    padding:5px 10px;border-radius:4px}
  .qq2-toolbar-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .qq2-excel-btn{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:#1E7A44;border-color:#A3D9B5}
  .qq2-excel-btn:hover{background:#E9F6EE;border-color:#1E7A44;color:#1E7A44}
  .qq2-filter-daterange{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);padding:2px 7px;border-radius:4px}
  .qq2-filter-daterange:focus-within{border-color:var(--accent)}
  .qq2-filter-date{border:none;background:transparent;font-size:12px;color:var(--ink);font-family:inherit;padding:2px 0;outline:none;cursor:pointer}
  .qq2-week-badge{display:inline-block;font-size:11px;font-weight:700;color:var(--header);background:#E2ECF0;border-radius:3px;padding:2px 6px;margin:4px 6px 2px 6px}

  tr.qq2-row-focus td:first-child{border-left:4px solid #DC2626;font-weight:700;color:#DC2626}
  .qq2-prio-select{font-size:12px;font-weight:700;border-radius:4px;padding:5px 6px;text-align:center;cursor:pointer}
  .qq2-prio-high{background:#FEE2E2 !important;color:#B91C1C !important}
  .qq2-prio-med{background:#FEF3C7 !important;color:#B45309 !important}
  .qq2-prio-low{background:#E0F2FE !important;color:#0369A1 !important}
  .qq2-prio-none{color:var(--muted);background:transparent}


  .qq2-export{display:none;border-top:1px solid var(--line);background:#FAFBFB;padding:14px 18px}
  .qq2-export.open{display:block}
  .qq2-export-preview{width:100%;min-height:260px;border:1px solid var(--line);border-radius:4px;
    padding:14px 16px;font-size:13px;line-height:1.6;font-family:Calibri,'Segoe UI',Arial,sans-serif;background:#fff}
  .qq2-export-preview a{color:#0078D4;text-decoration:underline;font-weight:600}
  .qq2-export-actions{display:flex;gap:8px;margin-top:10px;align-items:center}
  .qq2-copy-btn{background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:4px;
    font-size:13px;font-weight:600}
  .qq2-copy-btn:hover{opacity:0.9}
  .qq2-copy-msg{font-size:12.5px;color:var(--done-text);opacity:0;transition:opacity .2s}
  .qq2-copy-msg.show{opacity:1}

  /* Filter bar */
  .qq2-filterbar{background:#FAFBFB;border-bottom:1px solid var(--line);padding:8px 18px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
  .qq2-filter-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .qq2-filter-label{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
  .qq2-filter-pill{background:#fff;border:1px solid var(--line);color:var(--ink);padding:4px 11px;
    border-radius:14px;font-size:12px;cursor:pointer;font-weight:600;transition:all 150ms ease;
    display:inline-flex;align-items:center;gap:4px}
  .qq2-filter-pill:hover{border-color:var(--accent);color:var(--accent);background:#EEF4F6}
  .qq2-filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .qq2-filter-select{background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:4px;
    font-size:12px;color:var(--ink);cursor:pointer;outline:none;transition:border-color 150ms ease}
  .qq2-filter-select:focus{border-color:var(--accent)}
  .qq2-filter-search{background:#fff;border:1px solid var(--line);padding:4px 9px;border-radius:4px;
    font-size:12px;color:var(--ink);width:145px;transition:all 150ms ease}
  .qq2-filter-search:focus{outline:none;border-color:var(--accent);width:185px}
  .qq2-filter-clear{background:transparent;border:none;color:#B23A3A;font-size:11.5px;cursor:pointer;
    font-weight:700;padding:3px 7px;border-radius:3px}
  .qq2-filter-clear:hover{background:#FDECEC}

  .qq2-body{padding:14px 18px 20px}
  .qq2-cat{margin-top:22px}
  .qq2-cat:first-child{margin-top:0}
  .qq2-cat-title{font-size:13.5px;font-weight:700;background:#EDF1F2;padding:7px 10px;
    border-radius:4px 4px 0 0;border:1px solid var(--line);border-bottom:none}

  table.qq2-table{width:100%;border-collapse:collapse;border:1px solid var(--line)}
  table.qq2-table th{background:#F3F5F5;font-size:12px;font-weight:700;text-align:left;
    padding:6px 8px;border:1px solid var(--line);color:var(--muted)}
  table.qq2-table td{border:1px solid var(--line);padding:0;vertical-align:middle}
  table.qq2-table td.qq2-no{text-align:center;font-size:12.5px;color:var(--muted);padding:6px 4px}
  tr.qq2-row-done{background:var(--done-bg);transition:background-color 150ms ease}
  tr.qq2-row-next{background:var(--next-bg);transition:background-color 150ms ease}

  .qq2-cell-input{width:100%;border:none;background:transparent;padding:7px 8px;font-size:13.5px;
    color:var(--ink)}
  .qq2-cell-input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff}
  textarea.qq2-cell-input{resize:none;font-family:inherit;line-height:1.4;min-height:34px}
  select.qq2-cell-input{padding:7px 6px}
  .qq2-pic-cell{padding:4px 6px !important;vertical-align:top}
  .qq2-pic-stack{display:flex;flex-direction:column;gap:3px}
  .qq2-pic-row{display:flex;align-items:center;gap:3px;position:relative}
  .qq2-pic-wrap{position:relative;flex:1;min-width:0}
  .qq2-pic-input{cursor:text;text-overflow:ellipsis;padding-right:16px}
  .qq2-pic-arrow{position:absolute;right:4px;top:50%;transform:translateY(-50%);
    pointer-events:none;color:var(--muted);font-size:9px}
  .qq2-pic-suggest{position:absolute;top:100%;left:0;min-width:210px;background:#fff;
    border:1px solid var(--accent);border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,0.18);
    max-height:220px;overflow-y:auto;z-index:999;margin:2px 0 0 0;padding:4px 0;list-style:none}
  .qq2-pic-opt{padding:7px 10px;cursor:pointer;font-size:12.5px;color:var(--ink);font-weight:600;
    transition:background-color 100ms ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qq2-pic-opt:hover,.qq2-pic-opt.active{background:#EEF4F6;color:var(--header)}
  .qq2-pic-empty{padding:8px 10px;font-size:12px;color:var(--muted);font-style:italic;text-align:center}
  .qq2-pic-remove{border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:14px;padding:0 3px;line-height:1;border-radius:3px;flex-shrink:0}
  .qq2-pic-remove:hover{color:#B23A3A;background:#FDECEC}
  .qq2-pic-addbtn{border:1px dashed #B8C7CE;background:transparent;color:var(--accent);
    font-size:11px;padding:2px 6px;border-radius:3px;cursor:pointer;text-align:left;
    align-self:flex-start;margin-top:1px;transition:all 150ms ease}
  .qq2-pic-addbtn:hover{border-color:var(--accent);background:#EEF4F6}
  tr:focus-within{position:relative;z-index:40}
  input.qq2-cell-input.note{color:var(--muted);font-style:italic}
  input.qq2-cell-input.note:focus{font-style:normal;color:var(--ink)}

  .qq2-status-cell{padding:0 !important}
  .qq2-status-btn{width:100%;height:100%;border:none;background:transparent;font-size:12.5px;
    font-weight:700;padding:7px 6px;text-align:center}
  tr.qq2-row-done .qq2-status-btn{color:var(--done-text)}
  tr.qq2-row-next .qq2-status-btn{color:var(--next-text)}
  .qq2-status-btn:hover{text-decoration:underline}

  .qq2-del{width:26px;text-align:center;color:#C4CBCE;border:none;background:transparent;font-size:16px}
  .qq2-del:hover{color:#B23A3A}

  .qq2-addrow{display:block;width:100%;text-align:left;background:#FAFBFB;border:1px solid var(--line);
    border-top:none;color:var(--muted);font-size:12.5px;padding:6px 10px}
  .qq2-addrow:hover{color:var(--accent);background:#EEF4F6}

  .qq2-empty{border:1px solid var(--line);border-top:none;padding:10px;font-size:12.5px;
    color:var(--muted);font-style:italic}
  .qq2-loading{padding:36px;text-align:center;color:var(--muted);font-size:13px}

  /* Auth — Operate-mode */
  #qq2-auth{max-width:420px;margin:56px auto;font-family:Calibri,'Segoe UI',Arial,sans-serif;padding:0 14px}
  .qq2-auth-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .qq2-auth-head{background:var(--header);color:#fff;padding:18px 22px}
  .qq2-auth-title{font-size:17px;font-weight:700}
  .qq2-auth-sub{font-size:12.5px;color:#D7E2E8;margin-top:4px;line-height:1.4}
  .qq2-auth-body{padding:20px 22px}
  .qq2-auth-label{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;display:block}
  .qq2-auth-input{width:100%;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:13.5px;background:#fff;transition:border-color 150ms ease,box-shadow 150ms ease}
  .qq2-auth-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(28,110,140,0.15)}
  .qq2-auth-field{margin-bottom:14px}
  .qq2-auth-error{display:none;font-size:12.5px;color:#B23A3A;background:#FDECEC;border:1px solid #F5C6C6;border-radius:4px;padding:8px 10px;margin-bottom:14px;line-height:1.4}
  .qq2-auth-error.show{display:block}
  .qq2-auth-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:9px 14px;border-radius:4px;font-size:13.5px;font-weight:700;transition:opacity 150ms ease}
  .qq2-auth-btn:hover{opacity:0.9}
  .qq2-auth-btn:disabled{opacity:0.55;cursor:wait}
  .qq2-auth-hint{font-size:11.5px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.4}
  .qq2-userbox{display:none;align-items:center;gap:10px}
  .qq2-userbox.show{display:flex}
  .qq2-user-email{font-size:12.5px;color:#D7E2E8;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qq2-logout{background:transparent;border:1px solid #7E97A3;color:#D7E2E8;font-size:12.5px;padding:5px 11px;border-radius:4px;white-space:nowrap}
  .qq2-logout:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,0.08)}
  #qq2.qq2-hidden{display:none}
</style>
</head>
<body>

<div id="qq2-auth" style="display:none">
  <div class="qq2-auth-card">
    <div class="qq2-auth-head">
      <div class="qq2-auth-title">เข้าสู่ระบบ QA/QC Tracker</div>
      <div class="qq2-auth-sub">เฉพาะอีเมลที่ได้รับอนุญาตเท่านั้น</div>
    </div>
    <div class="qq2-auth-body">
      <div class="qq2-auth-error" id="qq2-auth-error"></div>
      <form id="qq2-auth-form" onsubmit="return false">
        <div class="qq2-auth-field">
          <label class="qq2-auth-label" for="qq2-auth-email">อีเมล (@scg.com)</label>
          <input class="qq2-auth-input" id="qq2-auth-email" type="email" placeholder="อีเมล (@scg.com)" autocomplete="email" required>
        </div>
        <button class="qq2-auth-btn" id="qq2-auth-submit" type="submit">เข้าสู่ระบบ</button>
      </form>
      <div class="qq2-auth-hint">กรอกอีเมลที่ได้รับอนุญาตเพื่อเข้าใช้งาน</div>
    </div>
  </div>
</div>

<div id="qq2" class="qq2-hidden">
  <div class="qq2-update" id="qq2-update" role="alert" hidden>
    <span>มีเวอร์ชันใหม่ของหน้านี้ กรุณารีเฟรชก่อนใช้งานต่อ</span>
    <button id="qq2-update-reload" type="button">รีเฟรชหน้านี้</button>
  </div>
  <div class="qq2-header">
    <div class="qq2-header-row">
      <div class="qq2-title">QA/QC Weekly Sync</div>
      <select class="qq2-week-select" id="qq2-week-select" aria-label="เลือกสัปดาห์"></select>
      <button class="qq2-newweek" id="qq2-toggle-newweek">+ สัปดาห์ใหม่</button>
      <a class="qq2-db-link" id="qq2-db-link" style="display:none" href="https://supabase.com/dashboard/project/grtrpbnccqbtpaoovmoa" target="_blank" rel="noopener noreferrer" title="เปิด Supabase Dashboard ในแท็บใหม่">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
        ฐานข้อมูล
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <div class="qq2-userbox" id="qq2-userbox">
        <span class="qq2-user-email" id="qq2-user-email" title=""></span>
        <button class="qq2-logout" id="qq2-logout">ออกจากระบบ</button>
      </div>
    </div>
    <div class="qq2-newweek-form" id="qq2-newweek-form">
      <input type="text" id="qq2-newweek-input" placeholder="เช่น 7 - 11 Sep 2026">
      <button id="qq2-newweek-confirm">สร้าง (ดึงงานค้างมาให้)</button>
      <button class="qq2-cancel" id="qq2-newweek-cancel">ยกเลิก</button>
    </div>
  </div>

  <div class="qq2-toolbar">
    <div class="qq2-stats" id="qq2-stats"></div>
    <div class="qq2-toolbar-btns">
      <span class="qq2-sync offline" id="qq2-sync"><span class="dot"></span><span id="qq2-sync-text">กำลังเชื่อมต่อ...</span></span>
      <button class="qq2-extra-toggle" id="qq2-export-toggle">เตรียมข้อความส่งเมล</button>
      <button class="qq2-extra-toggle qq2-excel-btn" id="qq2-export-excel-btn" title="ส่งออกข้อมูลเป็นไฟล์ Excel (.xlsx)">📥 ส่งออก Excel</button>
    </div>
  </div>

  <div class="qq2-filterbar" id="qq2-filterbar">
    <div class="qq2-filter-group">
      <span class="qq2-filter-label">ตัวกรอง:</span>
      <button class="qq2-filter-pill active" id="qq2-filter-pill-all" type="button">ทั้งหมด</button>
      <button class="qq2-filter-pill" id="qq2-filter-pill-my" type="button" title="แสดงเฉพาะงานที่ฉันรับผิดชอบ">👤 งานของฉัน</button>
      <button class="qq2-filter-pill" id="qq2-filter-pill-high" type="button" title="แสดงเฉพาะงานที่สำคัญเร่งด่วน (High)">🔥 High เท่านั้น</button>
      <button class="qq2-filter-pill" id="qq2-filter-pill-next" type="button" title="แสดงเฉพาะงานที่ยังไม่เสร็จ (Next Step)">⏳ ยังไม่เสร็จ</button>
      <button class="qq2-filter-pill" id="qq2-filter-pill-done" type="button" title="แสดงเฉพาะงานที่เสร็จแล้ว (Action Done)">✅ เสร็จแล้ว</button>
    </div>
    <div class="qq2-filter-group">
      <div class="qq2-filter-daterange" title="กรองงานตามช่วงวันที่">
        <span class="qq2-filter-label" style="margin:0 2px 0 0">ช่วงวันที่:</span>
        <input type="date" class="qq2-filter-date" id="qq2-filter-date-from" title="จากวันที่" aria-label="จากวันที่">
        <span style="color:var(--muted);font-size:11px">ถึง</span>
        <input type="date" class="qq2-filter-date" id="qq2-filter-date-to" title="ถึงวันที่" aria-label="ถึงวันที่">
      </div>
      <select class="qq2-filter-select" id="qq2-filter-pic" aria-label="กรองตามผู้รับผิดชอบ">
        <option value="">-- ผู้รับผิดชอบ (ทั้งหมด) --</option>
      </select>
      <select class="qq2-filter-select" id="qq2-filter-priority" aria-label="กรองตาม Priority">
        <option value="">-- Priority (ทั้งหมด) --</option>
        <option value="High">🔥 High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>

  function parseWeekDateRange(label, createdAt){
    if(!label){
      if(createdAt){
        const d = new Date(createdAt);
        return { start: d, end: d };
      }
      return null;
    }
    // Pattern 1: "24 - 28 Aug 2026"
    let m = label.match(/(\d{1,2})\s*-\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);
    if(m){
      const startDay = parseInt(m[1], 10);
      const endDay = parseInt(m[2], 10);
      const monthIdx = WEEK_LABEL_MONTHS.findIndex(mon => mon.toLowerCase() === m[3].toLowerCase());
      const year = parseInt(m[4], 10);
      if(monthIdx !== -1){
        return {
          start: new Date(year, monthIdx, startDay, 0, 0, 0),
          end: new Date(year, monthIdx, endDay, 23, 59, 59)
        };
      }
    }
    // Pattern 2: "31 Aug - 4 Sep 2026"
    m = label.match(/(\d{1,2})\s+([A-Za-z]{3})\s*-\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);
    if(m){
      const startDay = parseInt(m[1], 10);
      const startMon = WEEK_LABEL_MONTHS.findIndex(mon => mon.toLowerCase() === m[2].toLowerCase());
      const endDay = parseInt(m[3], 10);
      const endMon = WEEK_LABEL_MONTHS.findIndex(mon => mon.toLowerCase() === m[4].toLowerCase());
      const year = parseInt(m[5], 10);
      if(startMon !== -1 && endMon !== -1){
        return {
          start: new Date(year, startMon, startDay, 0, 0, 0),
          end: new Date(year, endMon, endDay, 23, 59, 59)
        };
      }
    }
    // Pattern 3: "28 Dec 2026 - 1 Jan 2027"
    m = label.match(/(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s*-\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);
    if(m){
      const startDay = parseInt(m[1], 10);
      const startMon = WEEK_LABEL_MONTHS.findIndex(mon => mon.toLowerCase() === m[2].toLowerCase());
      const startYear = parseInt(m[3], 10);
      const endDay = parseInt(m[4], 10);
      const endMon = WEEK_LABEL_MONTHS.findIndex(mon => mon.toLowerCase() === m[5].toLowerCase());
      const endYear = parseInt(m[6], 10);
      if(startMon !== -1 && endMon !== -1){
        return {
          start: new Date(startYear, startMon, startDay, 0, 0, 0),
          end: new Date(endYear, endMon, endDay, 23, 59, 59)
        };
      }
    }
    // Fallback: created_at
    if(createdAt){
      const d = new Date(createdAt);
      const dEnd = new Date(d);
      dEnd.setDate(dEnd.getDate() + 5);
      return { start: d, end: dEnd };
    }
    return null;
  }

  async function loadDateRangeData(){
    const from = activeFilter.dateFrom ? new Date(activeFilter.dateFrom + 'T00:00:00') : null;
    const to = activeFilter.dateTo ? new Date(activeFilter.dateTo + 'T23:59:59') : null;

    const matchingWeeks = weeks.filter(w => {
      const range = parseWeekDateRange(w.label, w.created_at);
      if(!range) return false;
      if(from && range.end < from) return false;
      if(to && range.start > to) return false;
      return true;
    });

    const weekIds = matchingWeeks.map(w => w.id);
    let fetched = [];
    if(weekIds.length){
      const {data, error} = await db.from('items').select('*').in('week_id', weekIds).order('no', {ascending:true});
      if(!error && data){
        fetched = data.map(rowToItem);
      }
    }

    // Include items with due date matching the range
    if(activeFilter.dateFrom || activeFilter.dateTo){
      let q = db.from('items').select('*').not('due', 'is', null);
      if(activeFilter.dateFrom) q = q.gte('due', activeFilter.dateFrom);
      if(activeFilter.dateTo) q = q.lte('due', activeFilter.dateTo);
      const {data: dueItems, error: dueErr} = await q;
      if(!dueErr && dueItems){
        const existingIds = new Set(fetched.map(i => i.id));
        dueItems.forEach(di => {
          if(!existingIds.has(di.id)){
            fetched.push(rowToItem(di));
            existingIds.add(di.id);
          }
        });
      }
    }

    items = fetched;
  }

    const focus = items.filter(i => i.status !== 'Action Done' && (i.priority === 'High' || i.priority === 'สูง')).length;
    const pct = total ? Math.round((done/total)*100) : 0;
    const focusHtml = focus > 0 ? ` &nbsp;·&nbsp; <span class="sf">🔥 ${focus} ต้อง Focus</span>` : '';

  function isEditingInBody(){
    const el = document.activeElement;
    if(!bodyEl.contains(el) || el === bodyEl) return false;
    // Only free-text fields need this guard: their value commits to `item` on
    // blur, so a re-render mid-keystroke would redraw with the stale value
    // and swallow what's being typed. Buttons/selects/date commit instantly
    // on click/change, so they must always re-render to show the result.
    return el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text');
  }

  function createPicInput(item, field, onUpdate){
    const wrap = document.createElement('div');
    wrap.className = 'qq2-pic-wrap';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'qq2-cell-input qq2-pic-input';
    const currentVal = item[field] || '-';
    input.value = (currentVal && currentVal !== '-') ? currentVal : '';
    input.title = currentVal;
    input.placeholder = field === 'pic1' ? 'เลือกผู้รับผิดชอบ...' : 'คนที่ 2...';
    input.autocomplete = 'off';

    const arrow = document.createElement('span');
    arrow.className = 'qq2-pic-arrow';
    arrow.textContent = '▾';
    arrow.style.pointerEvents = 'auto';
    arrow.style.cursor = 'pointer';
    arrow.onmousedown = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if(list.style.display === 'block'){
        list.style.display = 'none';
      } else {
        input.focus();
        renderSuggestions(ROSTER);
      }
    };

    const list = document.createElement('ul');
    list.className = 'qq2-pic-suggest';
    list.style.display = 'none';

    let activeIdx = -1;

    function renderSuggestions(matches){
      list.innerHTML = '';
      if(!matches.length){
        const emptyLi = document.createElement('li');
        emptyLi.className = 'qq2-pic-empty';
        emptyLi.textContent = 'ไม่พบชื่อที่ค้นหา';
        list.appendChild(emptyLi);
        list.style.display = 'block';
        return;
      }
      matches.forEach((name, idx) => {
        const li = document.createElement('li');
        li.className = 'qq2-pic-opt' + (idx === activeIdx ? ' active' : '');
        li.textContent = name;
        li.onmousedown = (e) => {
          e.preventDefault();
          e.stopPropagation();
          choose(name);
        };
        list.appendChild(li);
      });
      list.style.display = 'block';
    }

    function choose(name){
      item[field] = name;
      input.value = (name && name !== '-') ? name : '';
      input.title = name || '-';
      list.style.display = 'none';
      updateItem(item.id, {[field]: name}).then(() => {
        renderExportPreview();
        if(onUpdate) onUpdate();
      });
    }

    input.addEventListener('focus', () => {
      input.select();
      activeIdx = -1;
      renderSuggestions(ROSTER);
    });

    input.addEventListener('input', () => {
      activeIdx = -1;
      const matches = matchRoster(input.value);
      renderSuggestions(matches);
    });

    input.addEventListener('keydown', (e) => {
      if(list.style.display === 'none'){
        if(e.key === 'ArrowDown'){
          renderSuggestions(ROSTER);
          return;
        }
        return;
      }
      const opts = list.querySelectorAll('.qq2-pic-opt');
      if(!opts.length) return;

      if(e.key === 'ArrowDown'){
        e.preventDefault();
        activeIdx = (activeIdx + 1) % opts.length;
        opts.forEach((el, idx) => el.classList.toggle('active', idx === activeIdx));
        opts[activeIdx].scrollIntoView({block:'nearest'});
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        activeIdx = (activeIdx - 1 + opts.length) % opts.length;
        opts.forEach((el, idx) => el.classList.toggle('active', idx === activeIdx));
        opts[activeIdx].scrollIntoView({block:'nearest'});
      } else if(e.key === 'Enter'){
        e.preventDefault();
        if(activeIdx >= 0 && opts[activeIdx]){
          opts[activeIdx].dispatchEvent(new MouseEvent('mousedown'));
        } else {
          const matches = matchRoster(input.value);
          if(matches.length){
            choose(matches[0]);
          } else {
            const fallback = item[field] || '-';
            input.value = (fallback && fallback !== '-') ? fallback : '';
            list.style.display = 'none';
          }
        }
        input.blur();
      } else if(e.key === 'Escape'){
        list.style.display = 'none';
      }
    });

    input.addEventListener('blur', () => {
      setTimeout(() => {
        list.style.display = 'none';
      }, 150);
      const typed = input.value.trim();
      if(!typed || typed === '-'){
        choose('-');
        return;
      }
      const exact = ROSTER.find(name => name.toLowerCase() === typed.toLowerCase());
      if(exact){
        choose(exact);
      } else {
        const matches = matchRoster(typed);
        if(matches.length === 1){
          choose(matches[0]);
        } else {
          const fallback = item[field] || '-';
          input.value = (fallback && fallback !== '-') ? fallback : '';
        }
      }
    });

    wrap.appendChild(input);
    wrap.appendChild(arrow);
    wrap.appendChild(list);
    return wrap;
  }

  function renderPicCell(item){
    const td = document.createElement('td');
    td.className = 'qq2-pic-cell';

    const stack = document.createElement('div');

      stack.appendChild(row1);

        const row2 = document.createElement('div');

          await updateItem(item.id, {pic2: '-'});
          renderExportPreview();
          rebuild();
        };
        row2.appendChild(removeBtn);
        stack.appendChild(row2);
      } else {
        const addBtn = document.createElement('button');
        addBtn.className = 'qq2-pic-addbtn';
        addBtn.textContent = '+ คนที่ 2';
        addBtn.title = 'เพิ่มผู้รับผิดชอบคนที่ 2';

          }
        };
        stack.appendChild(addBtn);
      }
    }

    rebuild();
    td.appendChild(stack);
    return td;
  }

  async function addItem(catId){
    // Prefill from the active filter so the new task belongs to the person being viewed
    const filterPic = activeFilter.pic || (activeFilter.myTasksOnly ? getCurrentUserPic() : '') || '-';
    const item = {
      id: crypto.randomUUID(),
      week_id: currentWeekId,
      task_key: crypto.randomUUID(),
      no: nextNoForCat(catId),
      cat: catId, action: '', pic1: filterPic, pic2: '-',
      status: 'Next Step', note: '', priority: activeFilter.priority || '-', due: null, tag_pic: false
    };
    const {error} = await db.from('items').insert(item);
    if(error){ setSyncState('offline', 'เพิ่มงานไม่สำเร็จ: ' + error.message); return; }
    const sig = filterSig();
    if(justAdded.sig !== sig) justAdded = { sig, ids: new Set() };
    justAdded.ids.add(item.id);
    items.push(rowToItem(item));
    renderStats();
    renderBody();
    renderExportPreview();
  }

  // Every copy of a task shares its task_key (the migration backfilled old
  // rows), so this reaches every copy in any week even after the text was edited.
  async function removeTaskCopiesAcrossWeeks(item){
    if(!item || !item.taskKey) return;
    const {error} = await db.from('items').delete()
      .eq('task_key', item.taskKey)
      .neq('id', item.id);
    if(error){ setSyncState('offline', 'ลบสำเนางานไม่สำเร็จ: ' + error.message); }
  }

  // Carry forward only from the week right before the new one. That week is
  // the team's latest edited state: tasks deleted or reworded there must not
  // come back from older weeks, and edits must not leave the old wording behind.
  async function getCarryOverItems(targetWeekId){
    const targetIdx = weeks.findIndex(w => w.id === targetWeekId);
    if(targetIdx <= 0) return [];
    const prevWeekId = weeks[targetIdx - 1].id;

    const { data: rawItems, error } = await db
      .from('items')
      .select('*')
      .eq('week_id', prevWeekId)
      .order('no', {ascending: true});

    if(error || !rawItems) return [];
    return rawItems.filter(r => r.status !== 'Action Done' && (r.action || '').trim());
  }

  async function createNewWeek(label){
    const id = crypto.randomUUID();
    const {error: weekErr} = await db.from('weeks').insert({id, label});
    if(weekErr){ setSyncState('offline', 'สร้างสัปดาห์ไม่สำเร็จ: ' + weekErr.message); return; }
    
    weeks = await fetchWeeks();
    const pendingItems = await getCarryOverItems(id);
    if(pendingItems.length){
      const toInsert = [];
      CATEGORIES.forEach(cat => {
        const catPending = pendingItems.filter(i => i.cat === cat.id);
        let no = 1;
        catPending.forEach(i => {
          toInsert.push({
            id: crypto.randomUUID(),
            week_id: id,
            task_key: i.task_key || i.id,
            cat: cat.id,
            no: no++,
            action: (i.action || '').trim(),
            pic1: i.pic1 || '-',
            pic2: i.pic2 || '-',
            status: 'Next Step',
            note: i.note || '',
            priority: normalizePriority(i.priority),
            due: i.due || null,
            tag_pic: !!i.tag_pic
          });
        });
      });
      if(toInsert.length){
        const {error: itemsErr} = await db.from('items').insert(toInsert);
        if(itemsErr){ setSyncState('offline', 'ดึงงานค้างไม่สำเร็จ: ' + itemsErr.message); }
      }
    }
    await selectWeek(id);
  }

  const WEEK_LABEL_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function formatWeekLabel(monday){
    const friday = new Date(monday);
    friday.setDate(friday.getDate() + 4);
    const sameMonth = monday.getMonth() === friday.getMonth();
    const startPart = sameMonth ? `${monday.getDate()}` : `${monday.getDate()} ${WEEK_LABEL_MONTHS[monday.getMonth()]}`;
    return `${startPart} - ${friday.getDate()} ${WEEK_LABEL_MONTHS[friday.getMonth()]} ${friday.getFullYear()}`;
  }

  function parseEndDateFromLabel(label){
    if(!label) return null;
    // Matches patterns like "24 - 28 Aug 2026", "31 Aug - 4 Sep 2026", "7 - 11 Sep 2026"
    const m = label.match(/-\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);
    if(m){
      const day = parseInt(m[1], 10);
      const monthIdx = WEEK_LABEL_MONTHS.findIndex(mon => mon.toLowerCase() === m[2].toLowerCase());
      const year = parseInt(m[3], 10);
      if(monthIdx !== -1 && !isNaN(day) && !isNaN(year)){
        return new Date(year, monthIdx, day);
      }
    }
    return null;
  }

  function suggestedWeekLabel(){
    // Try to get next Monday after the latest existing week
    if(weeks && weeks.length){
      const lastWeek = weeks[weeks.length - 1];
      const endDate = parseEndDateFromLabel(lastWeek.label);
      if(endDate){
        // The previous week ended on Friday, so next week starts on Monday (+3 days)
        const nextMon = new Date(endDate);
        const dayOfWeek = nextMon.getDay(); // 5 for Friday
        const daysToAdd = dayOfWeek === 5 ? 3 : (1 - dayOfWeek + 7) % 7 || 7;
        nextMon.setDate(nextMon.getDate() + daysToAdd);
        return formatWeekLabel(nextMon);
      }
    }
    // Fallback: calculate next Monday from today
    const now = new Date();
    now.setHours(0,0,0,0);
    const day = now.getDay();
    now.setDate(now.getDate() + (1 - day + 7) % 7);
    return formatWeekLabel(now);
  }

  document.getElementById('qq2-toggle-newweek').onclick = () => {
    const form = document.getElementById('qq2-newweek-form');
    const opening = !form.classList.contains('open');
    form.classList.toggle('open');
    const input = document.getElementById('qq2-newweek-input');
    if(opening){
      input.value = suggestedWeekLabel();
      input.focus();
      input.select();
    }
  };
  document.getElementById('qq2-newweek-cancel').onclick = () => {
    document.getElementById('qq2-newweek-form').classList.remove('open');
  };
  document.getElementById('qq2-newweek-confirm').onclick = async () => {
    const input = document.getElementById('qq2-newweek-input');
    const confirmBtn = document.getElementById('qq2-newweek-confirm');
    const label = input.value.trim();
    if(!label){ input.style.borderColor = '#B23A3A'; return; }
    if(confirmBtn.disabled) return;
    if(weeks.some(w => (w.label || '').trim() === label)){
      alert('มีสัปดาห์ที่ใช้ชื่อนี้อยู่แล้ว กรุณาใช้ชื่ออื่นค่ะ');
      return;
    }
    if(await isPageStale()){
      alert('หน้านี้เป็นเวอร์ชันเก่า กรุณารีเฟรชหน้าเว็บก่อนสร้างสัปดาห์ใหม่ค่ะ');
      return;
    }
    input.style.borderColor = '';
    document.getElementById('qq2-newweek-form').classList.remove('open');
    input.value = '';
    confirmBtn.disabled = true;
    try{
      await createNewWeek(label);
    } finally {
      confirmBtn.disabled = false;
    }
  };



  document.getElementById('qq2-export-toggle').onclick = () => {
    document.getElementById('qq2-export').classList.toggle('open');
    renderExportPreview();
  };

  weekSelect.onchange = async () => {
    if(weekSelect.value === '__range__') return;
    activeFilter.dateFrom = '';
    activeFilter.dateTo = '';
    const dateFromEl = document.getElementById('qq2-filter-date-from');
    const dateToEl = document.getElementById('qq2-filter-date-to');
    if(dateFromEl) dateFromEl.value = '';
    if(dateToEl) dateToEl.value = '';
    await selectWeek(weekSelect.value);
    updateFilterUI();
  };

  function exportToExcel(){
    if(typeof XLSX === 'undefined'){
      alert('กำลังโหลดโมดูล Excel กรุณาลองใหม่อีกครั้ง');
      return;
    }

    const filteredItems = items.filter(matchesFilter);
    if(filteredItems.length === 0){
      alert('ไม่มีรายการงานที่ตรงกับตัวกรองที่เลือกสำหรับส่งออก');
      return;
    }

    const catMap = new Map();
    CATEGORIES.forEach(c => catMap.set(c.id, c.name));

    const exportRows = filteredItems.map((item, idx) => {
      const weekLabel = getWeekLabelById(item.weekId) || currentWeekLabel();
      const catName = catMap.get(item.cat) || item.cat;
      return {
        'สัปดาห์': weekLabel,
        'ลำดับ': item.no || (idx + 1),
        'หมวดหมู่งาน': catName,
        'งานที่ต้องทำ': item.action || '',
        'ผู้รับผิดชอบ 1': (item.pic1 && item.pic1 !== '-') ? item.pic1 : '',
        'ผู้รับผิดชอบ 2': (item.pic2 && item.pic2 !== '-') ? item.pic2 : '',
        'สถานะ': item.status || 'Next Step',
        'ลำดับความสำคัญ': (item.priority && item.priority !== '-') ? item.priority : '',
        'กำหนดเสร็จ (Due Date)': item.due || '',
        'หมายเหตุ': item.note || ''
      };
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(exportRows);

    ws['!cols'] = [
      { wch: 22 }, // สัปดาห์
      { wch: 8 },  // ลำดับ
      { wch: 44 }, // หมวดหมู่งาน
      { wch: 55 }, // งานที่ต้องทำ
      { wch: 24 }, // ผู้รับผิดชอบ 1
      { wch: 24 }, // ผู้รับผิดชอบ 2
      { wch: 15 }, // สถานะ
      { wch: 14 }, // ลำดับความสำคัญ
      { wch: 16 }, // กำหนดเสร็จ
      { wch: 32 }  // หมายเหตุ
    ];

    XLSX.utils.book_append_sheet(wb, ws, 'QAQC_MOM');

    let fileName = 'QAQC_Weekly_MOM';
    if(activeFilter.dateFrom || activeFilter.dateTo){
      const fromStr = activeFilter.dateFrom || 'เริ่มต้น';
      const toStr = activeFilter.dateTo || 'สิ้นสุด';
      fileName += `_${fromStr}_ถึง_${toStr}`;
    } else {
      const currentLbl = currentWeekLabel();
      if(currentLbl){
        fileName += '_' + currentLbl.replace(/[^a-zA-Z0-9ก-๙]/g, '_');
      }
    }
    if(activeFilter.status === 'Action Done'){
      fileName += '_ActionDone';
    }
    fileName += '.xlsx';

    XLSX.writeFile(wb, fileName);
  }

  const exportExcelBtn = document.getElementById('qq2-export-excel-btn');
  if(exportExcelBtn) exportExcelBtn.onclick = exportToExcel;

  document.getElementById('qq2-copy-btn').onclick = async () => {
    const plainText = buildEmailText();
    const htmlText = buildEmailHtml();
    let copied = false;
    try {
      if(navigator.clipboard && window.ClipboardItem){
        const textBlob = new Blob([plainText], { type: 'text/plain' });
        const htmlBlob = new Blob([htmlText], { type: 'text/html' });
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/plain': textBlob,
            'text/html': htmlBlob
          })
        ]);
        copied = true;
      } else {
        await navigator.clipboard.writeText(plainText);
        copied = true;
      }
    } catch(e){
      try {
        const el = document.getElementById('qq2-export-preview');
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        copied = document.execCommand('copy');
        sel.removeAllRanges();
      } catch(e2){
        try {
          await navigator.clipboard.writeText(plainText);
          copied = true;
        } catch(e3){
          copied = false;
        }
      }
    }
    const msg = document.getElementById('qq2-copy-msg');
    msg.textContent = copied ? 'คัดลอกข้อความพร้อมลิงก์แท็กแล้ว (นำไปวางใน Outlook ได้เลย)' : 'คัดลอกไม่สำเร็จ ลองเลือกข้อความแล้วกด Ctrl+C';
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2800);
  };

  // Filter Event Listeners
  document.getElementById('qq2-filter-pill-all').onclick = () => {
    clearAllFilters();
  };

  document.getElementById('qq2-filter-pill-my').onclick = () => {
    const myPic = getCurrentUserPic();
    if(!activeFilter.myTasksOnly && !myPic){
      alert('ไม่พบชื่อผู้รับผิดชอบที่ตรงกับอีเมลที่เข้าสู่ระบบ สามารถเลือกชื่อของคุณจากดรอปดาวน์ "ผู้รับผิดชอบ" ด้านขวาได้ค่ะ');
      return;
    }
    activeFilter.myTasksOnly = !activeFilter.myTasksOnly;
    updateFilterUI();
    renderBody();
    renderStats();
  };

  document.getElementById('qq2-filter-pill-high').onclick = () => {
    activeFilter.priority = activeFilter.priority === 'High' ? '' : 'High';
    updateFilterUI();
    renderBody();
    renderStats();
  };

  document.getElementById('qq2-filter-pill-next').onclick = () => {
    activeFilter.status = activeFilter.status === 'Next Step' ? '' : 'Next Step';
    updateFilterUI();
    renderBody();
    renderStats();
  };

  document.getElementById('qq2-filter-pill-done').onclick = () => {
    activeFilter.status = activeFilter.status === 'Action Done' ? '' : 'Action Done';
    updateFilterUI();
    renderBody();
    renderStats();
  };

  document.getElementById('qq2-filter-date-from').onchange = handleDateRangeChange;
  document.getElementById('qq2-filter-date-to').onchange = handleDateRangeChange;

  document.getElementById('qq2-filter-pic').onchange = (e) => {
    activeFilter.pic = e.target.value;
    updateFilterUI();
    renderBody();
    renderStats();
  };

  document.getElementById('qq2-filter-priority').onchange = (e) => {
    activeFilter.priority = e.target.value;
    updateFilterUI();
    renderBody();
    renderStats();
  };

  document.getElementById('qq2-filter-search').oninput = (e) => {
    activeFilter.search = e.target.value.trim().toLowerCase();
    updateFilterUI();
    renderBody();
    renderStats();
  };

  document.getElementById('qq2-filter-clear').onclick = () => {
    clearAllFilters();
  };

  async function loadAppData(){
    weeks = await fetchWeeks();
    populatePicFilterOptions();
    updateFilterUI();
    const startId = weeks.length ? weeks[weeks.length-1].id : null;
    if(startId){
      currentWeekId = startId;
      renderWeekSelect();
      await refreshItems();
      subscribeRealtime();
    } else {
      bodyEl.innerHTML = '<div class="qq2-empty">ยังไม่มีข้อมูลสัปดาห์</div>';
      setSyncState('online', 'ซิงก์แล้ว — ยังไม่มีข้อมูลสัปดาห์');
    }
  }

  function subscribeRealtime(){
    clearSyncChannel();
    realtimeChannel = db.channel('qq2-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'items'}, async payload => {
        const newWeekId = payload.new && payload.new.week_id;
        const oldWeekId = payload.old && payload.old.week_id;
        const oldId = payload.old && payload.old.id;

        const isCurrentWeek = newWeekId === currentWeekId || oldWeekId === currentWeekId || (oldId && items.some(i => i.id === oldId));

        if(isCurrentWeek){
          await refreshItems();
        }
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'weeks'}, () => {
        refreshWeeksKeepingSelection();
      })
      .subscribe(status => {
        if(status === 'SUBSCRIBED') setSyncState('online', 'ซิงก์แล้ว');
      });
  }

  // ---- Auth handlers — email only (no password, no OTP) -------------------------
  if(authForm){
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAuthError();
      const email = authEmailInput.value.trim();
      if(!email){
        showAuthError('กรุณากรอกอีเมล');
        return;
      }
      if(!isWhitelisted(email)){
        showAuthError('อีเมลนี้ไม่ได้รับสิทธิ์เข้าใช้งานระบบ QA/QC Tracker');
        return;
      }
      setAuthLoading(true);
      // Simulate short check then store email locally and enter app
      await new Promise(r => setTimeout(r, 280));
      const normalized = normalizeEmail(email);
      localStorage.setItem(LS_KEY, normalized);
      // Keep original casing for display
      showApp({email: email.trim()});
      clearAuthError();
      setAuthLoading(false);
      await loadAppData();
    });
  }
  if(logoutBtn){
    logoutBtn.addEventListener('click', async () => {
      localStorage.removeItem(LS_KEY);
      // Also sign out Supabase session if any (best effort)
      try{ if(db && db.auth) await db.auth.signOut(); }catch(_e){}
      weeks = [];
      currentWeekId = null;
      items = [];
      bodyEl.innerHTML = '<div class="qq2-loading">กำลังโหลดข้อมูล...</div>';
      statsEl.innerHTML = '';
      authEmailInput.value = '';
      clearAuthError();
      showAuth();
    });
  }

  // Stale-tab guard: a tab left open keeps running the code it loaded, so an
  // old tab can keep applying outdated rules (e.g. carry-forward) after a
  // deploy. Compare the served page's ETag with the one seen at load.
  const updateEl = document.getElementById('qq2-update');
  let loadedPageTag = null;
  async function fetchPageTag(){
    try{
      const r = await fetch(location.pathname, {method:'HEAD', cache:'no-store'});
      return r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null;
    }catch(_e){ return null; }
  }
  async function isPageStale(){
    const tag = await fetchPageTag();
    const stale = !!(tag && loadedPageTag && tag !== loadedPageTag);
    if(stale) updateEl.hidden = false;
    return stale;
  }
  fetchPageTag().then(tag => { loadedPageTag = tag; });
  document.addEventListener('visibilitychange', () => { if(!document.hidden) isPageStale(); });
  document.getElementById('qq2-update-reload').onclick = () => location.reload();

  (async function init(){
    if(!configured){
      authWrap.style.display = 'none';
      root.classList.remove('qq2-hidden');
      bodyEl.innerHTML = '<div class="qq2-empty">ยังไม่ได้ตั้งค่า Supabase — ใส่ SUPABASE_URL และ SUPABASE_ANON_KEY ในไฟล์นี้ก่อนใช้งาน</div>';
      setSyncState('offline', 'ยังไม่ได้ตั้งค่า');
      return;
    }

    // Email-only gate via localStorage (no password / no OTP)
    const saved = localStorage.getItem(LS_KEY);
    if(saved && isWhitelisted(saved)){
      // Restore email input for visibility
      authEmailInput.value = saved;
      showApp({email: saved});
      await loadAppData();
    } else {
      if(saved && !isWhitelisted(saved)){
        localStorage.removeItem(LS_KEY);
        showAuth();
        showAuthError('อีเมลนี้ไม่ได้รับสิทธิ์เข้าใช้งานระบบ QA/QC Tracker');
      } else {
        showAuth();
      }
    }

    // Keep Supabase auth state clean: sign out any stray session since we use email-only gate
    try{ if(db && db.auth) await db.auth.signOut(); }catch(_e){}

    // Also listen to Supabase auth changes to enforce whitelist if someone signs in via other means
    if(db && db.auth && db.auth.onAuthStateChange){
      db.auth.onAuthStateChange(async (event, session) => {
        const user = session && session.user;
        if(user && !isWhitelisted(user.email)){
          try{ await db.auth.signOut(); }catch(_e){}
          // Do not disrupt email-only session — just ensure no authenticated bypass
        }
      });
    }
  })();
})();
</script>
